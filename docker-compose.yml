services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - db

    ports:
      - "5000:8080"

    restart: always

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=ordermanagerdb;Username=postgres;Password=admin12345"

    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

    networks:
      - db

  db:
    image: postgres:17-trixie

    ports:
      - "5432:5432"

    volumes:
      - data:/var/lib/postgresql/data

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: ordermanagerdb

    networks:
      - db

  adminer:
    image: adminer:latest

    depends_on:
      - db

    ports:
      - "8080:8080"

    restart: always

    networks:
      - db

volumes:
  data:
    driver: local

  dataprotection_keys:
    driver: local

networks:
  db:
    driver: bridge
