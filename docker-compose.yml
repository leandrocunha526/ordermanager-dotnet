services:
  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - db

    ports:
      - "5000:8080"

    restart: always

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DBHOST: db
      DBPORT: 5432
      DBNAME: ordermanagerdb
      DBUSER: postgres
      DBPASSWORD: admin12345

    networks:
      - db

  # PostgreSQL Database service
  db:
    image: postgres:17-trixie

    ports:
      - "5432:5432"

    volumes:
      - data:/var/lib/postgresql/data

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: ordermanagerdb

    networks:
      - db

  # Adminer
  adminer:
    image: adminer:latest

    depends_on:
      - db

    ports:
      - "8080:8080"

    restart: always

    networks:
      - db

# Persistent PostgreSQL data
volumes:
  data:
    driver: local

# Network shared between API, PostgreSQL and Adminer
networks:
  db:
    driver: bridge
# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.
